name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint + cross-platform unit tests (fast, no Windows needed)
  # ---------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy
        run: mypy ramopt || true   # فعلاً غیرمسدودکننده؛ بعد از پایدار شدن اجباری می‌شود

      - name: Minimum Python version guard (3.9)
        run: |
          # Keep the declared floor honest: nothing may use syntax/APIs newer
          # than 3.9 (e.g. threading.__excepthook__, datetime.UTC, match, ...).
          python -m pip install vermin
          vermin -t=3.9- --no-tips --eval-annotations --violations \
            ramopt tests tools ram_optimizer_service.py

      - name: Pytest (cross-platform policy tests)
        run: |
          set -o pipefail
          pytest -q --tb=short 2>&1 | tee pytest-out.txt

      - name: Publish failure as annotation (readable without log access)
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR|E  |Traceback)' pytest-out.txt | head -12 | \
            while read -r line; do echo "::error::$line"; done
          if ! grep -qE '^(FAILED|ERROR)' pytest-out.txt; then
            tail -40 pytest-out.txt | while read -r line; do echo "::error::$line"; done
          fi

  # ---------------------------------------------------------------------------
  # Real Windows: real ctypes structures, real GlobalMemoryStatusEx,
  # real EmptyWorkingSet on a child process, then a full PyInstaller build.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Pytest (including Windows-only tests)
        run: pytest -q --tb=short 2>&1 | Tee-Object -FilePath pytest-out.txt; exit $LASTEXITCODE
        shell: pwsh

      - name: Publish failure as annotation (readable without log access)
        if: failure()
        shell: pwsh
        run: |
          $lines = Get-Content pytest-out.txt | Select-String -Pattern '^(FAILED|E  |assert)' | Select-Object -First 12
          foreach ($line in $lines) { Write-Output "::error::$($line.Line)" }
          if (-not $lines) { Get-Content pytest-out.txt -Tail 40 | ForEach-Object { Write-Output "::error::$_" } }

      - name: Build exe into build/
        shell: pwsh
        run: |
          python tools/make_version_info.py
          pyinstaller --clean --noconfirm RamOptimizerService.spec
          New-Item -ItemType Directory -Force -Path build | Out-Null
          if (Test-Path build\RamOptimizerService) { Remove-Item -Recurse -Force build\RamOptimizerService }
          Copy-Item -Recurse -Force dist\RamOptimizerService build\RamOptimizerService
          python tools/make_build_info.py

      - name: Check the control panel in build/
        shell: pwsh
        run: |
          # The PowerShell panel must at least parse and describe itself; its
          # Windows-only actions are exercised by the smoke test below.
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path build\RamOptimizerControl.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Output "::error::PS syntax: $($_.Message)" }
            exit 1
          }
          $help = & powershell -NoProfile -ExecutionPolicy Bypass -File build\RamOptimizerControl.ps1 -Action doctor
          if ($LASTEXITCODE -ne 0) { throw "control panel doctor failed" }
          if (-not (Test-Path build\Manage-RamOptimizer.bat)) { throw "Manage-RamOptimizer.bat is missing" }

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $exe = "build\RamOptimizerService\RamOptimizerService.exe"
          if (-not (Test-Path $exe)) { throw "exe was not built" }
          & $exe version
          if ($LASTEXITCODE -ne 0) { throw "version command failed" }
          & $exe config --init
          & $exe config --validate
          if ($LASTEXITCODE -ne 0) { throw "config validation failed" }
          & $exe test --dry-run
          if ($LASTEXITCODE -ne 0) { throw "dry-run failed" }

      - name: Smoke test the scenario (every minute, immediate when critical)
        shell: pwsh
        run: |
          # Read-only: verifies the real config values and that the critical
          # branch fires at once. Nothing is trimmed here.
          $exe = "build\RamOptimizerService\RamOptimizerService.exe"
          $out = & $exe verify --simulate-critical 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw "verify failed" }
          if ($out -notmatch 'هر 60 ثانیه') { throw "the 60 s cycle is not reported" }
          if ($out -notmatch 'T\+0s') { throw "the immediate critical pass is not reported" }
          if ($out -notmatch 'critical=True') { throw "the critical decision did not fire" }

      - name: Upload build/ (exe + control panel) as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RamOptimizerService-windows
          path: |
            build/RamOptimizerService/
            !build/RamOptimizerService/README.txt
            build/Manage-RamOptimizer.bat
            build/RamOptimizerControl.ps1
            build/build_info.json
            build/SHA256SUMS.txt
          retention-days: 14
