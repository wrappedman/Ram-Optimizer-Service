name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint + cross-platform unit tests (fast, no Windows needed)
  # ---------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy
        run: mypy ramopt || true   # فعلاً غیرمسدودکننده؛ بعد از پایدار شدن اجباری می‌شود

      - name: Minimum Python version guard (3.9)
        run: |
          # Keep the declared floor honest: nothing may use syntax/APIs newer
          # than 3.9 (e.g. threading.__excepthook__, datetime.UTC, match, ...).
          python -m pip install vermin
          vermin -t=3.9- --no-tips --eval-annotations --violations \
            ramopt tests tools ram_optimizer_service.py

      - name: Pytest (cross-platform policy tests)
        run: |
          set -o pipefail
          pytest -q --tb=short 2>&1 | tee pytest-out.txt

      - name: Publish failure as annotation (readable without log access)
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR|E  |Traceback)' pytest-out.txt | head -12 | \
            while read -r line; do echo "::error::$line"; done
          if ! grep -qE '^(FAILED|ERROR)' pytest-out.txt; then
            tail -40 pytest-out.txt | while read -r line; do echo "::error::$line"; done
          fi

  # ---------------------------------------------------------------------------
  # Real Windows: real ctypes structures, real GlobalMemoryStatusEx,
  # real EmptyWorkingSet on a child process, then a full PyInstaller build.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = the conservative choice; 3.15 = the newest that PyInstaller
        # supports (requires_python <3.16). Both build the real exe.
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Make git available to the tests (runner images sometimes lack it)
        shell: pwsh
        run: |
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            choco install git --no-progress -y | Out-Null
            $env:Path = "C:\Program Files\Git\cmd;$env:Path"
          }
          git --version

      - name: Pytest (including Windows-only tests)
        run: pytest -q --tb=short 2>&1 | Tee-Object -FilePath pytest-out.txt; exit $LASTEXITCODE
        shell: pwsh
        env:
          RAMOPT_REQUIRE_GIT_TESTS: "1"

      - name: Publish failure as annotation (readable without log access)
        if: failure()
        shell: pwsh
        run: |
          $lines = Get-Content pytest-out.txt | Select-String -Pattern '^(FAILED|E  |assert)' | Select-Object -First 12
          foreach ($line in $lines) { Write-Output "::error::$($line.Line)" }
          if (-not $lines) { Get-Content pytest-out.txt -Tail 40 | ForEach-Object { Write-Output "::error::$_" } }

      - name: Build with the shipping script (tools/build_exe.ps1)
        shell: pwsh
        run: |
          # Run the same script users run, so a broken build script fails CI.
          # -SkipTests: the suite already ran above.
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\build_exe.ps1 -SkipTests 2>&1 |
            Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) { throw "build_exe.ps1 failed with $LASTEXITCODE" }
          if (-not (Test-Path build\RamOptimizerService\RamOptimizerService.exe)) {
            throw "build_exe.ps1 did not produce the exe"
          }

      - name: Check the control panel in build/
        shell: pwsh
        run: |
          # The PowerShell panel must at least parse and describe itself; its
          # Windows-only actions are exercised by the smoke test below.
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path build\RamOptimizerControl.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Output "::error::PS syntax: $($_.Message)" }
            exit 1
          }
          # The .bat launchers must have CRLF + ASCII, and the panel a BOM.
          foreach ($bat in @('build_exe.bat', 'build\build_exe.bat', 'build\Manage-RamOptimizer.bat')) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $bat))
            if ($bytes -contains 13 -eq $false) { throw "$bat has no CRLF line endings" }
            if (($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) { throw "$bat contains non-ASCII bytes" }
          }
          if (-not (Test-Path build\Manage-RamOptimizer.bat)) { throw "Manage-RamOptimizer.bat is missing" }

          # Every read-only action must run and print proper English text.
          # (Regression: a PS7-only escape made the menu print `u{067E}`...)
          $panel = 'build\RamOptimizerControl.ps1'
          foreach ($action in @('status', 'logs', 'config', 'doctor', 'verify')) {
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -File $panel -Action $action 2>&1 | Out-String
            Write-Output "--- $action ---"
            Write-Output $out
            if ($out -match '`u\{') { throw "$action printed raw escape sequences" }
            if ($out -match 'u\{[0-9A-Fa-f]{4}\}') { throw "$action printed raw escape sequences" }
          }

          # And the interactive menu itself: option 3 (status), then 0 (exit).
          $menu = "3`n`n0`n" | & powershell -NoProfile -ExecutionPolicy Bypass -File $panel 2>&1 | Out-String
          Write-Output $menu
          if ($menu -notmatch 'RAM Optimizer Service') { throw "the menu did not render" }
          if ($menu -notmatch 'Install') { throw "the menu has no Install entry" }
          if ($menu -match 'u\{[0-9A-Fa-f]{4}\}') { throw "the menu printed raw escape sequences" }

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $exe = "build\RamOptimizerService\RamOptimizerService.exe"
          if (-not (Test-Path $exe)) { throw "exe was not built" }
          & $exe version
          if ($LASTEXITCODE -ne 0) { throw "version command failed" }
          & $exe config --init
          & $exe config --validate
          if ($LASTEXITCODE -ne 0) { throw "config validation failed" }
          & $exe test --dry-run
          if ($LASTEXITCODE -ne 0) { throw "dry-run failed" }

      - name: Smoke test the scenario (every minute, immediate when critical)
        shell: pwsh
        run: |
          # Read-only: verifies the real config values and that the critical
          # branch fires at once. Nothing is trimmed here.
          $exe = "build\RamOptimizerService\RamOptimizerService.exe"
          $out = & $exe verify --simulate-critical 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw "verify failed" }
          if ($out -notmatch 'هر 60 ثانیه') { throw "the 60 s cycle is not reported" }
          if ($out -notmatch 'T\+0s') { throw "the immediate critical pass is not reported" }
          if ($out -notmatch 'critical=True') { throw "the critical decision did not fire" }

      - name: Publish failure as annotation (any step)
        if: failure()
        shell: pwsh
        run: |
          foreach ($file in @('build-log.txt', 'pytest-out.txt')) {
            if (-not (Test-Path $file)) { continue }
            Write-Output "::error::$file"
            # Lines that explain the failure first, then the tail for context.
            Get-Content $file | Select-String -Pattern 'ERROR|error:|Traceback|FAIL|Exception|not found' |
              Select-Object -Last 25 | ForEach-Object { Write-Output "::error::$($_.Line)" }
            Get-Content $file -Tail 25 | ForEach-Object { Write-Output "::error::$_" }
          }

      - name: Upload build/ (exe + control panel) as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RamOptimizerService-windows-${{ matrix.python-version }}
          path: |
            build/RamOptimizerService/
            !build/RamOptimizerService/README.txt
            build/Manage-RamOptimizer.bat
            build/RamOptimizerControl.ps1
            build/build_info.json
            build/SHA256SUMS.txt
          retention-days: 14
