name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint + cross-platform unit tests (fast, no Windows needed)
  # ---------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy
        run: mypy ramopt || true   # فعلاً غیرمسدودکننده؛ بعد از پایدار شدن اجباری می‌شود

      - name: Pytest (cross-platform policy tests)
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Real Windows: real ctypes structures, real GlobalMemoryStatusEx,
  # real EmptyWorkingSet on a child process, then a full PyInstaller build.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Pytest (including Windows-only tests)
        run: pytest -q

      - name: Build exe
        run: |
          python tools/make_version_info.py
          pyinstaller --clean --noconfirm RamOptimizerService.spec

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $exe = "dist\RamOptimizerService\RamOptimizerService.exe"
          if (-not (Test-Path $exe)) { throw "exe was not built" }
          & $exe version
          if ($LASTEXITCODE -ne 0) { throw "version command failed" }
          & $exe config --init
          & $exe config --validate
          if ($LASTEXITCODE -ne 0) { throw "config validation failed" }
          & $exe test --dry-run
          if ($LASTEXITCODE -ne 0) { throw "dry-run failed" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RamOptimizerService-windows
          path: dist/RamOptimizerService/
          retention-days: 14
